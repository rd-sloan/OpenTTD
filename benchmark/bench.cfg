; OpenTTD configuration for benchmark runs.
;
; Used via -c benchmark\bench.cfg, together with -x so that a run can never
; write changes back into this file.
;
; Only settings verified to exist in src/table/settings/*.ini are listed here.
; An unrecognised key is ignored silently, so a typo would quietly disable
; whatever it was meant to control.

[gui]
; Write exit.sav into the autosave directory when the run finishes. This is the
; fixture the byte-for-byte determinism comparison comes from. The default is
; false, so without this no save is produced and the check silently does nothing.
autosave_on_exit = true

; Disable periodic autosaves, which would otherwise add unrelated file writes
; part way through a timed run. 0 disables.
autosave_interval = 0

; Save synchronously. With threaded saves the process can exit before exit.sav
; has been fully written, which would make the determinism fixture unreliable.
threaded_saves = false
